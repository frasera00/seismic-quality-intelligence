[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seismic-quality-intelligence"
version = "0.1.0"
description = "ML-based anomaly detection for seismic trace quality control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Fabio Rasera" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1",
  "pre-commit>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seismic_quality_intelligence"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  "notebooks",
  "data",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["seismic_quality_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --cov=seismic_quality_intelligence --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["seismic_quality_intelligence"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 30